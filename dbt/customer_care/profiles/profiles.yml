customer_care:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'customer_care') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'etl_user') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      schema: marts
      threads: 4
      connect_timeout: 10
      retries: 2
